name: release

# Pushing a version tag turns the GoReleaser config (.goreleaser.yaml) into a
# GitHub release with the archives, Linux packages (deb, rpm, apk), checksums,
# SBOMs and a cosign signature, and pushes the multi-arch container image to
# GHCR. Pull requests and pushes to main run `goreleaser check` only, so a
# config that would fail a real release is caught long before the tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate on every PR and push: the config parses and is valid for the
  # installed GoReleaser version. No artifacts are built here.
  check:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  # Build the real archives without publishing anything, so the smoke job below
  # has the same bytes a user downloads. --snapshot turns off every publish step;
  # the skips drop the three that need tools this job does not install (cosign,
  # syft, buildx). The archives are what we are after, and they are built from the
  # same builds and archives blocks a tag uses.
  snapshot:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=docker,sign,sbom,publish,announce
      - uses: actions/upload-artifact@v5.0.0
        with:
          name: snapshot-archives
          path: |
            dist/bento_*_linux_amd64.tar.gz
            dist/bento_*_windows_amd64.zip
          retention-days: 1

  # Unpack a shipped archive and use the binary in it. Nothing had ever done this:
  # the release produced a Windows zip on every tag and no job ever opened one, so
  # a binary that could not start would have reached users before anyone noticed.
  #
  # Linux is here as the control. If a step fails on Windows and passes on Linux,
  # the archive is not the problem, the platform is.
  #
  # windows_arm64 and the other targets are still unproven. GitHub has arm64
  # Windows runners now, so that is worth adding, but it is a separate change and
  # the amd64 zip is the one every Scoop install pulls.
  smoke:
    if: github.ref_type != 'tag'
    needs: snapshot
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, archive: linux_amd64.tar.gz, bento: bento, out: hello, platform: linux, joined: a/b/c }
          - { os: windows-latest, archive: windows_amd64.zip, bento: bento.exe, out: hello.exe, platform: win32, joined: a\b\c }
    runs-on: ${{ matrix.os }}
    # bash on both, so there is one script rather than two. Every path below is
    # relative: RUNNER_TEMP and GITHUB_WORKSPACE are backslash paths on Windows,
    # which the MSYS coreutils in Git Bash read as filenames rather than as
    # directories, so a mkdir -p "$RUNNER_TEMP/x" there makes one oddly named
    # directory instead of the tree it looks like it makes.
    defaults:
      run:
        shell: bash
    steps:
      # The checkout is not what is under test; it is here because an AOT build
      # needs the module source to link the runtime against. See below.
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - uses: actions/download-artifact@v6.0.0
        with:
          name: snapshot-archives
          path: archives
      # Unpack beside the checkout rather than inside it, so the binary sits where
      # a user would put it. The difference is not cosmetic: an AOT build looks for
      # the bento module by walking up from the executable, so unpacking into the
      # source tree would answer the question this job is asking.
      - name: unpack the archive
        run: |
          rm -rf ../smoke && mkdir -p ../smoke
          archive=$(ls archives/bento_*_${{ matrix.archive }})
          echo "unpacking $archive"
          case "$archive" in
            *.zip)
              # Git Bash has no unzip, and its tar is GNU tar, which does not read
              # zip. PowerShell is on the image and does. cygpath because this is
              # the one call that crosses into a native program that wants a
              # Windows path.
              powershell -NoProfile -Command "Expand-Archive -Path '$(cygpath -w "$archive")' -DestinationPath '$(cygpath -w ../smoke)' -Force"
              ;;
            *)
              tar -xzf "$archive" -C ../smoke
              ;;
          esac
          ls -l ../smoke
      - name: the binary starts and knows its version
        run: ../smoke/${{ matrix.bento }} --version
      # The archive holds the binary, LICENSE and README, and nothing else. An AOT
      # build compiles the generated Go against the value runtime, so it needs that
      # source, and a downloaded bento has no way to find it: moduleRoot walks up
      # from the executable and from the working directory looking for bento's
      # go.mod and finds neither. That is a real hole, tracked in #765. Pin it
      # here rather than let the next step hide it behind an environment variable.
      - name: an unpacked binary cannot AOT-build on its own
        run: |
          rm -rf ../bare && mkdir -p ../bare
          echo 'console.log("hi");' > ../bare/hello.ts
          cd ../bare
          if out=$(../smoke/${{ matrix.bento }} build hello.ts 2>&1); then
            echo "It built. That is good news, and this step is now the wrong shape: delete it."
            exit 1
          fi
          case "$out" in
            *"cannot locate the bento module source"*) echo "expected: $out" ;;
            *) echo "failed for another reason: $out"; exit 1 ;;
          esac
      - name: it compiles a program and the program runs
        run: |
          rm -rf ../hello && mkdir -p ../hello
          # Named imports, because a default or namespace import of a core module
          # does not lower yet. path.join is the point: it is the one call whose
          # answer is the platform's rather than the compiler's, so the output says
          # which platform the program was compiled for and not just that it ran.
          cat > ../hello/hello.ts <<'TS'
          import { join } from "node:path";
          console.log(`hello from ${process.platform}`);
          console.log(join("a", "b", "c"));
          TS
          { echo "hello from ${{ matrix.platform }}"; echo '${{ matrix.joined }}'; } > ../hello/want.txt
          cd ../hello
          BENTO_MODULE_ROOT="$GITHUB_WORKSPACE" ../smoke/${{ matrix.bento }} build hello.ts
          ./${{ matrix.out }} > got.txt
          cat got.txt
          diff --strip-trailing-cr want.txt got.txt

  # The real release, only on a version tag.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push the image to ghcr.io
      id-token: write # keyless cosign signing
    env:
      LINUX_REPO_DISPATCH_TOKEN: ${{ secrets.LINUX_REPO_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # Build and ship the linux/arm64 image from the amd64 runner.
      - uses: docker/setup-qemu-action@v4.2.0
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tools GoReleaser shells out to for signing and SBOMs.
      # Pin cosign to the 2.x line. cosign 3.x makes the new bundle format the
      # default, which ignores the --output-signature/--output-certificate flags
      # the signs block uses and aborts. Pinning keeps the .sig/.pem outputs and
      # stops the release tool from floating to a breaking latest.
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: "v2.6.3"
      - uses: anchore/sbom-action/download-syft@v0.24.0

      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Creating the release and pushing the GHCR image use the built-in
          # token. The package-manager publish steps each read their own secret;
          # any that is unset leaves that manager skipped (the artifact is still
          # produced), so the release never fails for a tap that is not set up.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}

      # Rebuild the Linux apt/dnf repository with the packages just released.
      # Skipped when the dispatch token is unset, so the release never depends
      # on it being configured.
      - name: Refresh the Linux package repository
        if: env.LINUX_REPO_DISPATCH_TOKEN != ''
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $LINUX_REPO_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/tamnd/linux-repo/dispatches \
            -d '{"event_type":"package-released"}' || true)
          if [ "$code" = "204" ]; then
            echo "Linux repo refresh triggered"
          else
            echo "Linux repo refresh not accepted (HTTP $code); skipping"
          fi
